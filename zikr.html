<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأذكار — نُورُ الْإِيمَانِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pattern-overlay"></div>

<header class="site-header">
  <div class="top-bar-tools">
    <button id="themeToggleBtn" class="theme-btn" title="تبديل الثيم">
      <span class="btn-content">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </span>
    </button>
    <a href="index.html" class="home-btn">
      <span class="btn-content">الرئيسية</span>
    </a>
  </div>
  <div class="arch">
    <div class="arch-inner">
      <svg class="crescent-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9.93 9.93 0 0 0-7.38 3.32A9.99 9.99 0 0 0 12 22a9.94 9.94 0 0 0 7.38-3.32A10 10 0 0 1 12 2z"/></svg>
    </div>
  </div>
  <h1 class="site-title">نُورُ الْإِيمَانِ</h1>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn" data-cat="afterPrayer"><span class="btn-content">بعد الصلاة</span></button>
  <button class="tab-btn" data-cat="morning"><span class="btn-content">الصباح</span></button>
  <button class="tab-btn" data-cat="evening"><span class="btn-content">المساء</span></button>
  <button class="tab-btn" data-cat="sleep"><span class="btn-content">النوم</span></button>
  <button class="tab-btn" data-cat="misc"><span class="btn-content">متنوعة</span></button>
  <button class="tab-btn" data-cat="daily"><span class="btn-content">الحياة اليومية</span></button>
</nav>

<main id="app">
  <section class="cat-header" id="catHeader">
    <span class="cat-icon" id="catIcon"></span>
    <div>
      <h2 id="catTitle">…</h2>
      <p id="catDesc" class="cat-desc"></p>
    </div>
    <button class="reset-cat-btn icon-btn" id="resetCatBtn" title="إعادة ضبط">
      <span class="btn-content">إعادة ضبط</span>
    </button>
  </section>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="zikr-single-meta">
    <button class="pager-btn" id="prevZikrBtn">‹ السابق</button>
    <span id="zikrIndexLabel">1 / 1</span>
    <button class="pager-btn" id="nextZikrBtn">التالي ›</button>
  </div>

  <div class="zikr-single-wrap" id="zikrWrap">
    <div class="zikr-swipe-card" id="cardA"></div>
    <div class="zikr-swipe-card" id="cardB" style="visibility:hidden;"></div>
  </div>

  <div class="zikr-single-footer">
    <button class="copy-btn" id="copyZikrBtn">نسخ</button>
    <div class="font-controls">
      <span>حجم الخط:</span>
      <button id="decFontBtn" class="font-btn">A-</button>
      <button id="resetFontBtn" class="font-btn">إعادة</button>
      <button id="incFontBtn" class="font-btn">A+</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>«الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ»</p>
</footer>

<script src="common.js"></script>
<script src="zikr-data.js"></script>
<script src="zikr.js"></script>
</body>
</html>
