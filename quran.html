<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم — نُورُ الْإِيمَانِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pattern-overlay"></div>

<header class="site-header">
  <div class="top-bar-tools">
    <button id="themeToggleBtn" class="theme-btn" title="تبديل الثيم">
      <span class="btn-content">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </span>
    </button>
    <a href="index.html" class="home-btn">
      <span class="btn-content">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        الرئيسية
      </span>
    </a>
  </div>
  <div class="arch">
    <div class="arch-inner">
      <svg class="crescent-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9.93 9.93 0 0 0-7.38 3.32A9.99 9.99 0 0 0 12 22a9.94 9.94 0 0 0 7.38-3.32A10 10 0 0 1 12 2z"/></svg>
    </div>
  </div>
  <h1 class="site-title">نُورُ الْإِيمَانِ</h1>
  <p class="site-sub">القرآن الكريم — قراءة وتلاوة صوتية</p>
</header>

<main id="quranApp">

  <div class="quran-select-card">
    <button class="surah-dropdown-toggle" id="surahToggle">
      <span>
        <span class="surah-current-name" id="surahCurrentName">اختر سورة…</span><br>
        <span class="surah-current-info" id="surahCurrentInfo"></span>
      </span>
      <span class="chev">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </button>
    <div style="height:10px;"></div>
    <input type="text" id="quranSearch" class="quran-search-input" placeholder="ابحث عن اسم السورة..." />
    <div id="surahDropdownList" class="surah-dropdown-list"></div>
  </div>

  <div class="quran-select-card audio-player-container">
    <select id="reciterSelect" class="quran-select">
      <option value="">جاري تحميل القراء...</option>
    </select>
    <audio id="quranAudio" controls class="quran-audio-element"></audio>
  </div>

  <div class="surah-view-card" id="surahViewCard" style="display:none;">
    <div class="surah-title-box">
      <h2 id="surahTitle" class="surah-title"></h2>
    </div>

    <div id="ayahPage" class="ayah-page">جارٍ تحميل الآيات...</div>

    <div class="ayah-pager">
      <button class="pager-btn" id="ayahPrevBtn"><span class="btn-content">‹ السابق</span></button>
      <span class="ayah-page-info" id="ayahPageInfo"></span>
      <button class="pager-btn" id="ayahNextBtn"><span class="btn-content">التالي ›</span></button>
    </div>

    <div class="surah-view-actions">
      <button class="pager-btn" id="backToIndexBtn">
        <span class="btn-content">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          العودة للفهرس
        </span>
      </button>
      <button class="reload-audio-btn" id="reloadAudioBtn">
        <span class="btn-content">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          إعادة التحميل
        </span>
      </button>
    </div>
  </div>

  <p class="empty-state" id="quranEmptyState">اختر سورة من القائمة أعلاه لعرض آياتها والاستماع إليها.</p>

</main>

<footer class="site-footer">
  <p>«الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ»</p>
</footer>

<script src="common.js"></script>
<script src="quran.js"></script>
</body>
</html>
