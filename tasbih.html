<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المسبحة الإلكترونية — نُورُ الْإِيمَانِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pattern-overlay"></div>

<header class="site-header">
  <div class="top-bar-tools">
    <button id="themeToggleBtn" class="theme-btn" title="تبديل الثيم">
      <span class="btn-content">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </span>
    </button>
    <a href="index.html" class="home-btn">
      <span class="btn-content">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        الرئيسية
      </span>
    </a>
  </div>
  <div class="arch">
    <div class="arch-inner">
      <svg class="crescent-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9.93 9.93 0 0 0-7.38 3.32A9.99 9.99 0 0 0 12 22a9.94 9.94 0 0 0 7.38-3.32A10 10 0 0 1 12 2z"/></svg>
    </div>
  </div>
  <h1 class="site-title">نُورُ الْإِيمَانِ</h1>
  <p class="site-sub">المسبحة الإلكترونية</p>
</header>

<div class="tasbih-layout">

  <!-- السبحة (يمين) -->
  <div class="tasbih-right">
    <p class="current-dhikr" id="currentDhikrText">سُبْحَانَ اللَّهِ</p>

    <div class="counter-ring">
      <svg viewBox="0 0 120 120" class="ring-svg">
        <circle cx="60" cy="60" r="52" class="ring-bg"/>
        <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/>
      </svg>
      <div class="counter-number" id="counterNumber">0</div>
    </div>
    <p class="counter-round" id="counterRound">الدورة: 1</p>
    <div class="counter-actions">
      <button id="counterMinus" title="إنقاص"><span class="btn-content">−</span></button>
      <button id="counterReset" title="إعادة ضبط"><span class="btn-content">↺</span></button>
    </div>

    <div class="beads-track" id="beadsTrack">
      <div class="beads-string"></div>
      <div class="bead drag-bead" id="dragBead"></div>
      <div class="bead-tassel"></div>
    </div>
    <p class="drag-hint">اسحب الخرزة لأسفل أو اضغط عليها للعدّ</p>
  </div>

  <!-- بطاقات الأذكار (يسار) -->
  <div class="tasbih-left">
    <form class="custom-dhikr-form" id="customDhikrForm">
      <input type="text" id="customDhikrInput" class="custom-dhikr-input" placeholder="أضف ذكرًا خاصًا بك..." />
      <button type="submit" class="custom-dhikr-add" title="إضافة">+</button>
    </form>

    <div class="dhikr-cards" id="dhikrCards">
      <button class="dhikr-chip active" data-text="سُبْحَانَ اللَّهِ"><span>سبحان الله</span></button>
      <button class="dhikr-chip" data-text="الْحَمْدُ لِلَّهِ"><span>الحمد لله</span></button>
      <button class="dhikr-chip" data-text="اللَّهُ أَكْبَرُ"><span>الله أكبر</span></button>
      <button class="dhikr-chip" data-text="لَا إِلَهَ إِلَّا اللَّهُ"><span>لا إله إلا الله</span></button>
      <button class="dhikr-chip" data-text="أَسْتَغْفِرُ اللَّهَ"><span>أستغفر الله</span></button>
      <!-- أذكار المستخدم المخصّصة (IndexedDB) تُضاف هنا ديناميكيًا -->
    </div>
  </div>

</div>

<footer class="site-footer">
  <p>«الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ»</p>
</footer>

<script src="common.js"></script>
<script src="tasbih.js"></script>
</body>
</html>
